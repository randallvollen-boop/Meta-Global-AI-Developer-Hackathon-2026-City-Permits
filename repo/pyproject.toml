[project]
name = "acme-city"
version = "0.1.0"
description = "ACME City registry-MDM permit demonstration application (fictional data only)."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = [
    "alembic>=1.13,<2",
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "jinja2>=3.1,<4",
    "pydantic>=2.7,<3",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0,<3",
    "uvicorn>=0.30,<1",
]

[dependency-groups]
dev = [
    "httpx2>=2.6,<3",
    "playwright>=1.62,<1.63",
    "pytest>=8.2,<9",
    "pytest-asyncio>=0.23,<2",
    "pytest-xdist>=3.6,<4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/acme_city"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers --strict-config"
filterwarnings = [
    "error",
    # Documented third-party deprecations. Each entry names the emitting package.
    "ignore:datetime.datetime.utcnow\\(\\) is deprecated:DeprecationWarning",
    "ignore:The `dict` method is deprecated:DeprecationWarning:sqlalchemy.*",
]

[tool.ruff]
line-length = 100
target-version = "py312"
