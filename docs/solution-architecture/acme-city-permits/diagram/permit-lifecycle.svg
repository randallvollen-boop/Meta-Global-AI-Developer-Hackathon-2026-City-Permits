<svg class="lc-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1510 636" role="img" aria-labelledby="lc-title lc-desc"><title id="lc-title">Permit life cycle of ACME City Permits</title><desc id="lc-desc">The main path runs Draft, Submitted, Ready for review, Approved, Issued. The intake agent routes a submitted case to review or to early resolution (Needs information). From Needs information a person advances the case, returns it, or the applicant resubmits. A reviewer can request revisions, revert the agent recommendation (Under review), approve or deny. Any case but an issued one can be archived and restored. Withdrawn exists only in seeded history.</desc><style>.lc-edge{stroke:var(--edge,#7a8794);stroke-width:1.6;fill:none}.lc-label-bg{fill:var(--bg,#fff);opacity:.92}.lc-label{font:600 12px var(--font,system-ui,sans-serif);fill:var(--muted,#55616d)}.lc-box rect{fill:var(--node,#fff);stroke:var(--node-line,#9aa6b2);stroke-width:1.5}.lc-box text{font:600 14px var(--font,system-ui,sans-serif);fill:var(--ink,#14233f)}.lc-box .lc-small{font-weight:400;font-size:12px;fill:var(--muted,#55616d)}.lc-start rect{stroke:#c98a12;stroke-width:2.5}.lc-active rect{stroke:var(--accent,#1d5fa8);stroke-width:2.5}.lc-end rect{stroke:#2f7d4f;stroke-width:2.5}.lc-closed rect{stroke-dasharray:2 0}.lc-dashed rect{stroke-dasharray:6 4}#lc-arrow path{fill:var(--edge,#7a8794)}.lc-svg{display:block;width:100%;min-width:1100px}</style><defs><marker id="lc-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z"/></marker></defs><line class="lc-edge" x1="210.0" y1="198.0" x2="340.0" y2="198.0" marker-end="url(#lc-arrow)"/><rect class="lc-label-bg" x="249.0" y="172.0" width="52" height="18" rx="4"/><text class="lc-label" x="275.0" y="186.0" text-anchor="middle">Submit</text><line class="lc-edge" x1="530.0" y1="198.0" x2="660.0" y2="198.0" marker-end="url(#lc-arrow)"/><rect class="lc-label-bg" x="534.0" y="172.0" width="122" height="18" rx="4"/><text class="lc-label" x="595.0" y="186.0" text-anchor="middle">Agent: to review</text><line class="lc-edge" x1="850.0" y1="198.0" x2="980.0" y2="198.0" marker-end="url(#lc-arrow)"/><rect class="lc-label-bg" x="885.5" y="172.0" width="59" height="18" rx="4"/><text class="lc-label" x="915.0" y="186.0" text-anchor="middle">Approve</text><line class="lc-edge" x1="1170.0" y1="198.0" x2="1300.0" y2="198.0" marker-end="url(#lc-arrow)"/><rect class="lc-label-bg" x="1212.5" y="172.0" width="45" height="18" rx="4"/><text class="lc-label" x="1235.0" y="186.0" text-anchor="middle">Issue</text><line class="lc-edge" x1="419.0" y1="226.0" x2="419.0" y2="370.0" marker-end="url(#lc-arrow)"/><rect class="lc-label-bg" x="223.5" y="288.0" width="171" height="18" rx="4"/><text class="lc-label" x="309.0" y="302.0" text-anchor="middle">Agent: early resolution</text><line class="lc-edge" x1="451.0" y1="370.0" x2="451.0" y2="226.0" marker-end="url(#lc-arrow)"/><rect class="lc-label-bg" x="468.0" y="318.0" width="66" height="18" rx="4"/><text class="lc-label" x="501.0" y="332.0" text-anchor="middle">Resubmit</text><line class="lc-edge" x1="479.8" y1="370.0" x2="710.2" y2="226.0" marker-end="url(#lc-arrow)"/><rect class="lc-label-bg" x="587.5" y="300.0" width="59" height="18" rx="4"/><text class="lc-label" x="617.0" y="314.0" text-anchor="middle">Advance</text><line class="lc-edge" x1="435.0" y1="426.0" x2="435.0" y2="560.0" marker-end="url(#lc-arrow)"/><rect class="lc-label-bg" x="409.0" y="483.0" width="52" height="18" rx="4"/><text class="lc-label" x="435.0" y="497.0" text-anchor="middle">Return</text><line class="lc-edge" x1="755.0" y1="226.0" x2="755.0" y2="370.0" marker-end="url(#lc-arrow)"/><rect class="lc-label-bg" x="676.5" y="288.0" width="157" height="18" rx="4"/><text class="lc-label" x="755.0" y="302.0" text-anchor="middle">Revert recommendation</text><line class="lc-edge" x1="799.8" y1="370.0" x2="1030.2" y2="226.0" marker-end="url(#lc-arrow)"/><rect class="lc-label-bg" x="907.5" y="300.0" width="59" height="18" rx="4"/><text class="lc-label" x="937.0" y="314.0" text-anchor="middle">Approve</text><line class="lc-edge" x1="850.0" y1="398.0" x2="980.0" y2="398.0" marker-end="url(#lc-arrow)"/><rect class="lc-label-bg" x="896.0" y="372.0" width="38" height="18" rx="4"/><text class="lc-label" x="915.0" y="386.0" text-anchor="middle">Deny</text><line class="lc-edge" x1="726.3" y1="170.0" x2="623.7" y2="70.0" marker-end="url(#lc-arrow)"/><rect class="lc-label-bg" x="680.5" y="104.0" width="129" height="18" rx="4"/><text class="lc-label" x="745.0" y="118.0" text-anchor="middle">Request revisions</text><line class="lc-edge" x1="566.3" y1="70.0" x2="463.7" y2="170.0" marker-end="url(#lc-arrow)"/><rect class="lc-label-bg" x="436.0" y="104.0" width="66" height="18" rx="4"/><text class="lc-label" x="469.0" y="118.0" text-anchor="middle">Resubmit</text><g class="lc-box lc-active" data-status="revisions_requested"><rect x="500" y="14" width="190" height="56" rx="10"/><text x="595.0" y="47.0" text-anchor="middle">Revisions requested</text></g><g class="lc-box lc-start" data-status="draft"><rect x="20" y="170" width="190" height="56" rx="10"/><text x="115.0" y="203.0" text-anchor="middle">Draft</text></g><g class="lc-box lc-active" data-status="submitted"><rect x="340" y="170" width="190" height="56" rx="10"/><text x="435.0" y="203.0" text-anchor="middle">Submitted</text></g><g class="lc-box lc-active" data-status="ready_for_review"><rect x="660" y="170" width="190" height="56" rx="10"/><text x="755.0" y="203.0" text-anchor="middle">Ready for review</text></g><g class="lc-box lc-active" data-status="approved"><rect x="980" y="170" width="190" height="56" rx="10"/><text x="1075.0" y="203.0" text-anchor="middle">Approved</text></g><g class="lc-box lc-end" data-status="issued"><rect x="1300" y="170" width="190" height="56" rx="10"/><text x="1395.0" y="196.0" text-anchor="middle">Issued</text><text class="lc-small" x="1395.0" y="214.0" text-anchor="middle">a record correction reopens it</text></g><g class="lc-box lc-active" data-status="needs_information"><rect x="340" y="370" width="190" height="56" rx="10"/><text x="435.0" y="403.0" text-anchor="middle">Needs information</text></g><g class="lc-box lc-active" data-status="under_review"><rect x="660" y="370" width="190" height="56" rx="10"/><text x="755.0" y="403.0" text-anchor="middle">Under review</text></g><g class="lc-box lc-end" data-status="denied"><rect x="980" y="370" width="190" height="56" rx="10"/><text x="1075.0" y="403.0" text-anchor="middle">Denied</text></g><g class="lc-box lc-end lc-dashed" data-status="withdrawn"><rect x="1300" y="370" width="190" height="56" rx="10"/><text x="1395.0" y="396.0" text-anchor="middle">Withdrawn</text><text class="lc-small" x="1395.0" y="414.0" text-anchor="middle">seeded history only</text></g><g class="lc-box lc-end" data-status="returned"><rect x="340" y="560" width="190" height="56" rx="10"/><text x="435.0" y="593.0" text-anchor="middle">Returned</text></g><g class="lc-box lc-closed"><rect x="660" y="560" width="510" height="56" rx="10"/><text x="915.0" y="584" text-anchor="middle">Archived</text><text class="lc-small" x="915.0" y="600" text-anchor="middle">from any status but Issued; Restore returns the case</text></g></svg>
